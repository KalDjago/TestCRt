<!doctype html><html data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAM CRt V3.1</title><style>
:root{--r:#eb0a1e;--bg:#f3f5f8;--c:#fff;--t:#111827;--m:#667085;--l:#dde3ec;--s:#f8fafc;--n:#101827}html[data-theme=dark]{--bg:#0b1220;--c:#141e2e;--t:#eef2f7;--m:#9dacbf;--l:#2b394d;--s:#192638;--n:#050a12}*{box-sizing:border-box}body{margin:0;font:14px Segoe UI,Arial;background:var(--bg);color:var(--t)}header{background:var(--n);color:#fff;border-bottom:4px solid var(--r)}.head{max-width:1400px;margin:auto;padding:18px 24px;display:flex;justify-content:space-between}.brand{font-size:18px;font-weight:900}.brand span{color:var(--r)}nav{background:var(--c);border-bottom:1px solid var(--l);padding:0 max(24px,calc((100% - 1350px)/2))}nav button{padding:15px 20px;border:0;background:none;color:var(--m);font-weight:800}nav button.on{color:var(--r);border-bottom:3px solid var(--r)}main{max-width:1350px;margin:auto;padding:22px}.page{display:none}.page.on{display:block}.grid{display:grid;gap:15px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.card{background:var(--c);border:1px solid var(--l);border-radius:15px;padding:18px}.step{font-size:11px;color:var(--r);font-weight:900}.drop{display:block;padding:21px;border:2px dashed #aab7c8;border-radius:12px;text-align:center;background:var(--s);cursor:pointer}input[type=file]{display:none}label.x{display:block;font-size:12px;font-weight:700;color:var(--m);margin:9px 0 4px}input,select{width:100%;padding:9px;border:1px solid var(--l);border-radius:8px;background:var(--c);color:var(--t)}button{cursor:pointer}.p,.q,.d{border:0;border-radius:8px;padding:10px 13px;font-weight:800}.p{background:var(--r);color:#fff}.q{background:var(--s);color:var(--t);border:1px solid var(--l)}.d{background:#fee2e2;color:#991b1b}.theme{border:1px solid #536076;background:#172235;color:#fff;border-radius:99px;padding:8px 12px}.map{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:10px}.hidden{display:none!important}.status{margin:14px 0;padding:11px;border-radius:9px;background:#eef6ff;color:#245c91}.ok{background:#eaf8f2;color:#087a55}.err{background:#fff0f0;color:#a31320}.file{padding:9px;margin-top:7px;border:1px solid var(--l);background:var(--s);border-radius:8px}.actions{display:flex;gap:8px;flex-wrap:wrap}.metric b{font-size:25px;display:block;margin-top:7px}.metric{border-top:4px solid var(--r)}table{width:100%;border-collapse:collapse}th,td{padding:9px;text-align:right;border-bottom:1px solid var(--l)}th:first-child,td:first-child{text-align:left}th{font-size:10px;background:var(--s);color:var(--m)}@media(max-width:1000px){.g4,.g2{grid-template-columns:1fr}.map{grid-template-columns:1fr 1fr}}@media(max-width:600px){.map{grid-template-columns:1fr}}
</style></head><body><header><div class="head"><div class="brand"><span>T</span>OYOTA · TAM CRt Analytics V3.1</div><button id="theme" class="theme">Dark</button></div></header><nav><button class="on" data-p="new">New Analysis</button><button data-p="bank">Data Bank</button><button data-p="ref">Reference Data</button></nav><main>
<section id="new" class="page on"><div class="grid g4">
<div class="card"><div class="step">STEP 1</div><h3>Analysis Session</h3><label class="x">Analysis Name *</label><input id="name"><label class="x">CRt Year *</label><input id="year" type="number" value="2026"><label class="x">Period</label><input id="period"><label class="x">Notes</label><input id="notes"><button id="start" class="p" style="margin-top:10px">Start Analysis</button><div id="sess" class="status hidden"></div></div>
<div class="card"><div class="step">STEP 2</div><h3>Master UIO</h3><label class="drop">Select multiple Master UIO files<input id="masters" type="file" multiple accept=".csv,.xlsx,.xls,.xlsb"></label><div id="mcount" class="file hidden"></div><div id="mmap" class="map hidden"></div><button id="runMasters" class="p hidden" style="margin-top:10px">Process All Master Files</button><div id="mlog"></div></div>
<div class="card"><div class="step">STEP 3</div><h3>Population Filter</h3><button id="loadPop" class="q">Load Population Options</button><label class="x">Filter Level</label><select id="fl"><option>ALL</option><option>AREA</option><option>DEALER</option><option>OUTLET</option></select><label class="x">Filter Value</label><select id="fv"><option value="">All Uploaded UIO</option></select><button id="applyPop" class="p" style="margin-top:10px">Apply Population Filter</button><div id="pinfo" class="file hidden"></div></div>
<div class="card"><div class="step">STEP 4</div><h3>Achievement</h3><label class="drop">Select multiple Achievement CSV files<input id="achs" type="file" multiple accept=".csv"></label><div id="acount" class="file hidden"></div><div id="amap" class="map hidden"></div><button id="runAchs" class="p hidden" style="margin-top:10px">Process All Achievement Files</button><div id="alog"></div></div></div>
<div id="status" class="status hidden"></div><div class="card" style="margin-top:15px"><div class="actions"><button id="final" class="p" disabled>Finalize CRt</button></div></div>
<div id="res" class="hidden"><div class="grid g4" style="margin-top:15px"><div class="card metric">Eligible UIO<b id="uio"></b></div><div class="card metric">Same Outlet<b id="so"></b></div><div class="card metric">Same Dealer<b id="sd"></b></div><div class="card metric">Same Area / Total<b id="sa"></b><small id="tot"></small></div></div><div class="card" style="margin-top:15px;overflow:auto"><table><thead><tr><th>Age</th><th>Year</th><th>UIO</th><th>Same Outlet</th><th>Same Dealer</th><th>Same Area</th><th>Total</th></tr></thead><tbody id="tbody"></tbody></table></div><div class="card" style="margin-top:15px"><input id="savename"><button id="save" class="p" style="margin-top:8px">Save to Data Bank</button></div></div></section>
<section id="bank" class="page"><div class="card"><div class="actions"><h2 style="flex:1">Data Bank</h2><button id="delall" class="d">Delete All</button></div><div id="blist"></div></div></section>
<section id="ref" class="page"><div class="grid g2"><div class="card"><h2>Master Outlet</h2><label class="drop">Upload Master Outlet<input id="ofile" type="file" accept=".csv,.xlsx,.xls,.xlsb"></label><div id="omap" class="map hidden"></div><label class="x">Version</label><input id="over" value="Outlet Master 2026"><button id="oupload" class="p hidden" style="margin-top:10px">Save Master Outlet</button></div><div class="card"><h2>Reference Status</h2><div id="oref"></div><button id="odel" class="d" style="margin-top:10px">Delete Master Outlet</button></div></div></section>
</main><script>
const $=x=>document.getElementById(x),fmt=x=>Number(x||0).toLocaleString(),pct=x=>(100*Number(x||0)).toFixed(1)+'%';let sid='',pop=null;
async function api(u,o={}){let r=await fetch(u,o),t=await r.text(),j;try{j=JSON.parse(t)}catch{throw Error(`HTTP ${r.status}: ${t.slice(0,180)}`)}if(!r.ok)throw Error(j.detail||`HTTP ${r.status}`);return j}
function msg(t,k=''){let e=$('status');e.textContent=t;e.className='status '+(k==='ok'?'ok':k==='err'?'err':'')}
function options(cols,als=[]){return '<option value="">Select column</option>'+cols.map(c=>`<option ${als.includes(c.toUpperCase())?'selected':''}>${c}</option>`).join('')}
function fld(id,l,cols,a=[]){return `<div><label class="x">${l}</label><select id="${id}">${options(cols,a)}</select></div>`}
async function inspect(f){let d=new FormData();d.append('file',f);return api('/api/inspect',{method:'POST',body:d})}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button,.page').forEach(x=>x.classList.remove('on'));b.classList.add('on');$(b.dataset.p).classList.add('on');if(b.dataset.p==='bank')bank();if(b.dataset.p==='ref')ref()});let th=localStorage.theme||'light';function theme(){document.documentElement.dataset.theme=th;$('theme').textContent=th==='light'?'Dark':'Light'}theme();$('theme').onclick=()=>{th=th==='light'?'dark':'light';localStorage.theme=th;theme()};
$('start').onclick=async()=>{try{let d=new FormData();d.append('name',$('name').value||'Untitled');d.append('crt_year',$('year').value);d.append('period',$('period').value);d.append('notes',$('notes').value);sid=(await api('/api/sessions',{method:'POST',body:d})).id;$('sess').textContent='Session '+sid.slice(0,10);$('sess').className='status ok';$('final').disabled=false;msg('Session started. Upload Master UIO files.','ok')}catch(e){msg(e.message,'err')}};
$('masters').onchange=async e=>{try{let fs=[...e.target.files];$('mcount').textContent=`${fs.length} Master file(s) selected`;$('mcount').classList.remove('hidden');let c=(await inspect(fs[0])).columns;$('mmap').innerHTML=fld('mv','VIN *',c,['VIN'])+fld('md','Sales Date',c,['FINAL DATE','SALES DATE'])+fld('my','Sales Year',c,['SALES YEAR'])+fld('mo','Sales Outlet *',c,['OUTLET','OUTLET NAME','OUTLET NAME 2'])+fld('mc','Outlet Code',c,['OUTLET CODE'])+fld('mde','Dealer',c,['DEALER'])+fld('ma','Area',c,['CRT AREA','AREA']);$('mmap').classList.remove('hidden');$('runMasters').classList.remove('hidden')}catch(e){msg(e.message,'err')}};
$('runMasters').onclick=async()=>{if(!sid)return msg('Start Analysis first.','err');let fs=[...$('masters').files];$('mlog').innerHTML='';for(let i=0;i<fs.length;i++){try{msg(`Processing Master ${i+1}/${fs.length}: ${fs[i].name}`);let d=new FormData();d.append('file',fs[i]);[['vin_column','mv'],['sales_date','md'],['sales_year','my'],['sales_outlet','mo'],['outlet_code','mc'],['sales_dealer','mde'],['sales_area','ma']].forEach(x=>d.append(x[0],$(x[1]).value));let j=await api(`/api/sessions/${sid}/masters`,{method:'POST',body:d});$('mlog').innerHTML+=`<div class=file>✓ ${fs[i].name}: ${fmt(j.added)} VIN, ${fmt(j.duplicates)} duplicate, ${fmt(j.conflicts)} conflict</div>`}catch(e){$('mlog').innerHTML+=`<div class="file err">✕ ${fs[i].name}: ${e.message}</div>`}}msg('Master batch completed. Load Population Options.','ok')};
$('loadPop').onclick=async()=>{if(!sid)return msg('Start Analysis first.','err');try{pop=await api(`/api/sessions/${sid}/population`);$('pinfo').textContent=`Uploaded eligible VIN: ${fmt(pop.total)}`;$('pinfo').classList.remove('hidden');fillPop()}catch(e){msg(e.message,'err')}};function fillPop(){let l=$('fl').value,arr=l==='OUTLET'?pop.outlets:l==='DEALER'?pop.dealers:l==='AREA'?pop.areas:[];$('fv').innerHTML=l==='ALL'?'<option value="">All Uploaded UIO</option>':arr.map(x=>`<option>${x}</option>`).join('')}$('fl').onchange=()=>pop&&fillPop();$('applyPop').onclick=async()=>{try{let d=new FormData();d.append('level',$('fl').value);d.append('value',$('fv').value);let j=await api(`/api/sessions/${sid}/population`,{method:'POST',body:d});$('pinfo').textContent=`Selected: ${j.level}${j.value?' · '+j.value:''} · Eligible VIN: ${fmt(j.eligible)}`;msg('Population filter applied.','ok')}catch(e){msg(e.message,'err')}};
$('achs').onchange=async e=>{try{let fs=[...e.target.files];$('acount').textContent=`${fs.length} Achievement CSV file(s) selected`;$('acount').classList.remove('hidden');let sample=await fs[0].slice(0,65536).text(),line=sample.split(/\r?\n/)[0].replace(/^\uFEFF/,''),del=(line.match(/;/g)||[]).length>(line.match(/,/g)||[]).length?';':',',c=line.split(del).map(x=>x.replace(/^"|"$/g,'').trim());$('amap').innerHTML=fld('av','VIN *',c,['VIN'])+fld('ao','Service Outlet *',c,['OUTLET','OUTLET NAME'])+fld('ac','Outlet Code',c,['OUTLET CODE'])+fld('ade','Service Dealer',c,['DEALER']);$('amap').classList.remove('hidden');$('runAchs').classList.remove('hidden')}catch(e){msg(e.message,'err')}};
$('runAchs').onclick=async()=>{if(!sid)return msg('Start Analysis first.','err');let fs=[...$('achs').files];$('alog').innerHTML='';for(let i=0;i<fs.length;i++){try{msg(`Processing Achievement ${i+1}/${fs.length}: ${fs[i].name}`);let d=new FormData();d.append('file',fs[i]);[['vin_column','av'],['service_outlet','ao'],['outlet_code','ac'],['service_dealer','ade']].forEach(x=>d.append(x[0],$(x[1]).value));let j=await api(`/api/sessions/${sid}/achievements`,{method:'POST',body:d});$('alog').innerHTML+=`<div class=file>✓ ${fs[i].name}: ${fmt(j.rows)} rows, ${fmt(j.matched_unique_vin)} matched VIN, ${fmt(j.unmapped_rows)} unmapped</div>`}catch(e){$('alog').innerHTML+=`<div class="file err">✕ ${fs[i].name}: ${e.message}</div>`}}msg('Achievement batch completed.','ok')};
$('final').onclick=async()=>{try{let j=await api(`/api/sessions/${sid}/finalize`,{method:'POST'}),o=j.overall;$('uio').textContent=fmt(o.uio);$('so').textContent=pct(o.same_outlet_rate);$('sd').textContent=pct(o.same_dealer_rate);$('sa').textContent=pct(o.same_area_rate);$('tot').textContent='Total '+pct(o.total_rate);$('tbody').innerHTML=j.cohorts.map(x=>{let u=x.uio||0,p=k=>pct((x[k]||0)/u);return `<tr><td>${x.age}Y</td><td>${x.sales_year}</td><td>${fmt(u)}</td><td>${p('same_outlet')}</td><td>${p('same_dealer')}</td><td>${p('same_area')}</td><td>${p('total')}</td></tr>`}).join('');$('savename').value=j.session.name;$('res').classList.remove('hidden');msg('CRt finalized.','ok')}catch(e){msg(e.message,'err')}};$('save').onclick=async()=>{let d=new FormData();d.append('name',$('savename').value);await api(`/api/sessions/${sid}/save`,{method:'POST',body:d});msg('Saved to Data Bank.','ok')};
async function bank(){let j=await api('/api/results');$('blist').innerHTML=j.length?j.map(x=>`<div class=file><b>${x.name}</b> · ${x.period} · ${x.crt_year} <button class=d onclick="del('${x.id}')">Delete</button></div>`).join(''):'No saved results.'}window.del=async id=>{if(confirm('Delete saved result?')){await api('/api/results/'+id,{method:'DELETE'});bank()}};$('delall').onclick=async()=>{if(confirm('Delete all results?')){await api('/api/results',{method:'DELETE'});bank()}};
$('ofile').onchange=async e=>{let c=(await inspect(e.target.files[0])).columns;$('omap').innerHTML=fld('on','Outlet Name *',c,['OUTLET NAME'])+fld('od','Dealer *',c,['DEALER'])+fld('oa','CRt Area *',c,['CRT AREA'])+fld('oc','Outlet Code',c,['OUTLET CODE'])+fld('or','Region',c,['REGION','AREA'])+fld('op','Province',c,['PROVINCE']);$('omap').classList.remove('hidden');$('oupload').classList.remove('hidden')};$('oupload').onclick=async()=>{let d=new FormData();d.append('file',$('ofile').files[0]);[['outlet_name','on'],['dealer','od'],['crt_area','oa'],['outlet_code','oc'],['region','or'],['province','op']].forEach(x=>d.append(x[0],$(x[1]).value));d.append('version',$('over').value);let j=await api('/api/outlets',{method:'POST',body:d});alert(`Saved ${j.saved} outlets`);ref()};async function ref(){let j=await api('/api/outlets');$('oref').innerHTML=`<b>${fmt(j.count)} outlets</b><br>${j.version||'-'}<br>${j.updated_at||'-'}`}$('odel').onclick=async()=>{if(confirm('Delete Master Outlet?')){await api('/api/outlets',{method:'DELETE'});ref()}};ref();
</script></body></html>
