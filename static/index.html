<!doctype html><html data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAM CRt V2 Reborn</title><style>:root{--r:#eb0a1e;--bg:#f4f6f9;--c:#fff;--t:#111827;--m:#64748b;--l:#dde3eb;--s:#f8fafc;--n:#101827}html[data-theme=dark]{--bg:#0b1220;--c:#151f30;--t:#eef2f7;--m:#a0aec0;--l:#2c394c;--s:#1b293b;--n:#050a12}*{box-sizing:border-box}body{margin:0;font:14px Segoe UI,Arial;background:var(--bg);color:var(--t)}header{background:var(--n);color:#fff;border-bottom:4px solid var(--r);padding:18px 28px;display:flex;justify-content:space-between}.brand{font-size:19px;font-weight:900}.brand span{color:var(--r)}main{max-width:1350px;margin:auto;padding:22px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{background:var(--c);border:1px solid var(--l);border-radius:15px;padding:18px}.step{font-size:11px;color:var(--r);font-weight:900}.drop{display:block;border:2px dashed #a9b6c7;background:var(--s);padding:24px;text-align:center;border-radius:12px;cursor:pointer}input[type=file]{display:none}label.x{display:block;font-size:12px;color:var(--m);font-weight:700;margin:9px 0 4px}input,select{width:100%;padding:9px;border:1px solid var(--l);background:var(--c);color:var(--t);border-radius:8px}.p,.q{border:0;border-radius:8px;padding:10px 13px;font-weight:800;cursor:pointer}.p{background:var(--r);color:#fff}.q{background:var(--s);color:var(--t);border:1px solid var(--l)}.map{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.hidden{display:none!important}.status,.file{padding:10px;margin-top:10px;border-radius:8px;background:#eef6ff;color:#245c91}.file{background:var(--s);color:var(--t);border:1px solid var(--l)}.ok{background:#eaf8f2;color:#087a55}.err{background:#fff0f0;color:#a31320}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.metric{border-top:4px solid var(--r)}.metric b{display:block;font-size:28px;margin-top:7px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--l);text-align:right}th:first-child,td:first-child{text-align:left}th{font-size:10px;background:var(--s);color:var(--m)}@media(max-width:900px){.grid,.metrics{grid-template-columns:1fr}.map{grid-template-columns:1fr}}</style></head><body><header><div class="brand"><span>T</span>OYOTA · TAM CRt Analytics V2 Reborn</div><button id=theme class=q>Dark</button></header><main><div class=grid>
<div class=card><div class=step>STEP 1</div><h3>Analysis Settings</h3><label class=x>Analysis Name</label><input id=name><div style="display:flex;gap:8px"><div style="flex:1"><label class=x>CRt Year</label><input id=year type=number value=2026></div><div style="flex:1"><label class=x>Period</label><input id=period></div></div><label class=x>Calculation Level</label><select id=level><option>Outlet</option><option>Dealer</option><option>Area</option></select><button id=start class=p style="margin-top:10px">Start Analysis</button><div id=sess class="status hidden"></div></div>
<div class=card><div class=step>STEP 2</div><h3>Master UIO</h3><label class=drop>Select one or multiple Master files<input id=masters type=file multiple accept=".csv,.xlsx,.xls,.xlsb"></label><div id=mcount class="file hidden"></div><div id=mmap class="map hidden"></div><button id=runM class="p hidden" style="margin-top:10px">Process All Master Files</button><div id=mlog></div><button id=loadOrigin class=q style="margin-top:10px">Load Origin Filter</button><label class=x>Origin Filter</label><select id=origin><option value="">All Origins</option></select><button id=applyOrigin class=p style="margin-top:8px">Apply Filter</button><div id=oinfo class="file hidden"></div></div>
<div class=card><div class=step>STEP 3</div><h3>Achievement</h3><label class=drop>Select one or multiple Achievement CSV<input id=achs type=file multiple accept=".csv"></label><div id=acount class="file hidden"></div><div id=amap class="map hidden"></div><button id=runA class="p hidden" style="margin-top:10px">Process All Achievement Files</button><div id=alog></div></div></div>
<div id=status class="status hidden"></div><div class=card style="margin-top:15px"><button id=final class=p disabled>Calculate CRt</button></div><div id=result class=hidden><div class=metrics style="margin-top:15px"><div class="card metric">Eligible UIO<b id=uio></b></div><div class="card metric"><span id=sameLabel>Same</span><b id=same></b></div><div class="card metric"><span id=totalLabel>Total</span><b id=total></b></div></div><div class=card style="margin-top:15px;overflow:auto"><table><thead><tr><th>Age</th><th>Sales Year</th><th>UIO</th><th>Same VIN</th><th>CRt Same</th><th>Total VIN</th><th>CRt Total</th><th>Gap</th></tr></thead><tbody id=tbody></tbody></table></div></div></main><script>
const $=x=>document.getElementById(x),fmt=x=>Number(x||0).toLocaleString(),pct=x=>(100*Number(x||0)).toFixed(1)+'%';let sid='',origins=[];async function api(u,o={}){let r=await fetch(u,o),t=await r.text(),j;try{j=JSON.parse(t)}catch{throw Error(`HTTP ${r.status}: ${t.slice(0,180)}`)}if(!r.ok)throw Error(j.detail||`HTTP ${r.status}`);return j}function msg(t,k=''){let e=$('status');e.textContent=t;e.className='status '+(k==='ok'?'ok':k==='err'?'err':'')}function opts(c,a=[]){return '<option value="">Select column</option>'+c.map(x=>`<option ${a.includes(x.toUpperCase())?'selected':''}>${x}</option>`).join('')}function fld(id,l,c,a=[]){return `<div><label class=x>${l}</label><select id=${id}>${opts(c,a)}</select></div>`}async function inspect(f){let d=new FormData();d.append('file',f);return api('/api/inspect',{method:'POST',body:d})}let th=localStorage.theme||'light';function theme(){document.documentElement.dataset.theme=th;$('theme').textContent=th==='light'?'Dark':'Light'}theme();$('theme').onclick=()=>{th=th==='light'?'dark':'light';localStorage.theme=th;theme()};
$('start').onclick=async()=>{try{let d=new FormData();d.append('name',$('name').value||'Untitled');d.append('crt_year',$('year').value);d.append('period',$('period').value);d.append('level',$('level').value);sid=(await api('/api/sessions',{method:'POST',body:d})).id;$('sess').textContent='Session '+sid.slice(0,10);$('sess').className='status ok';$('final').disabled=false;msg('V2 memory-first session started.','ok')}catch(e){msg(e.message,'err')}};
$('masters').onchange=async e=>{try{let fs=[...e.target.files];$('mcount').textContent=fs.length+' Master file(s) selected';$('mcount').classList.remove('hidden');let c=(await inspect(fs[0])).columns;$('mmap').innerHTML=fld('mv','VIN *',c,['VIN'])+fld('md','Sales Date',c,['FINAL DATE','SALES DATE'])+fld('my','Sales Year',c,['SALES YEAR'])+fld('mo','Sales Origin *',c,['OUTLET','OUTLET NAME','OUTLET NAME 2','DEALER','AREA']);$('mmap').classList.remove('hidden');$('runM').classList.remove('hidden')}catch(e){msg(e.message,'err')}};$('runM').onclick=async()=>{if(!sid)return msg('Start Analysis first.','err');let fs=[...$('masters').files];$('mlog').innerHTML='';for(let i=0;i<fs.length;i++){try{msg(`Processing Master ${i+1}/${fs.length}`);let d=new FormData();d.append('file',fs[i]);[['vin_column','mv'],['sales_date','md'],['sales_year','my'],['sales_origin','mo']].forEach(x=>d.append(x[0],$(x[1]).value));let j=await api(`/api/sessions/${sid}/master`,{method:'POST',body:d});$('mlog').innerHTML+=`<div class=file>✓ ${fs[i].name}: ${fmt(j.added_unique)} unique VIN</div>`}catch(e){$('mlog').innerHTML+=`<div class="file err">✕ ${e.message}</div>`}}msg('Master processing completed.','ok')};
$('loadOrigin').onclick=async()=>{try{let j=await api(`/api/sessions/${sid}/origins`);origins=j.values;$('origin').innerHTML='<option value="">All Origins</option>'+origins.map(x=>`<option>${x}</option>`).join('');$('oinfo').textContent='Uploaded eligible unique VIN: '+fmt(j.total);$('oinfo').classList.remove('hidden')}catch(e){msg(e.message,'err')}};$('applyOrigin').onclick=async()=>{try{let d=new FormData();d.append('value',$('origin').value);let j=await api(`/api/sessions/${sid}/scope`,{method:'POST',body:d});$('oinfo').textContent=`Selected ${j.scope} · Eligible VIN ${fmt(j.eligible)}`;msg('Origin filter applied.','ok')}catch(e){msg(e.message,'err')}};
$('achs').onchange=async e=>{try{let fs=[...e.target.files],s=await fs[0].slice(0,65536).text(),line=s.split(/\r?\n/)[0].replace(/^\uFEFF/,''),del=(line.match(/;/g)||[]).length>(line.match(/,/g)||[]).length?';':',',c=line.split(del).map(x=>x.replace(/^"|"$/g,'').trim());$('acount').textContent=fs.length+' Achievement CSV file(s) selected';$('acount').classList.remove('hidden');$('amap').innerHTML=fld('av','VIN *',c,['VIN'])+fld('ad','Service Destination *',c,['OUTLET NAME','OUTLET','DEALER','AREA']);$('amap').classList.remove('hidden');$('runA').classList.remove('hidden')}catch(e){msg(e.message,'err')}};$('runA').onclick=async()=>{let fs=[...$('achs').files];$('alog').innerHTML='';for(let i=0;i<fs.length;i++){try{msg(`Processing Achievement ${i+1}/${fs.length}`);let d=new FormData();d.append('file',fs[i]);d.append('vin_column',$('av').value);d.append('service_destination',$('ad').value);let j=await api(`/api/sessions/${sid}/achievement`,{method:'POST',body:d});$('alog').innerHTML+=`<div class=file>✓ ${fs[i].name}: ${fmt(j.input_rows)} rows, ${fmt(j.matched_unique_vin)} matched VIN</div>`}catch(e){$('alog').innerHTML+=`<div class="file err">✕ ${e.message}</div>`}}msg('Achievement batch completed.','ok')};
$('final').onclick=async()=>{try{let j=await api(`/api/sessions/${sid}/finalize`,{method:'POST'}),o=j.overall,l=j.level[0]+j.level.slice(1).toLowerCase();$('uio').textContent=fmt(o.uio);$('same').textContent=pct(o.same_rate);$('total').textContent=pct(o.total_rate);$('sameLabel').textContent='Same '+l;$('totalLabel').textContent=l+' Total';$('tbody').innerHTML=j.cohorts.map(x=>`<tr><td>${x.age}Y</td><td>${x.sales_year}</td><td>${fmt(x.uio)}</td><td>${fmt(x.same_count)}</td><td>${pct(x.same_rate)}</td><td>${fmt(x.total_count)}</td><td>${pct(x.total_rate)}</td><td>${(x.gap*100).toFixed(1)} ppt</td></tr>`).join('');$('result').classList.remove('hidden');msg('CRt calculation completed.','ok')}catch(e){msg(e.message,'err')}};
</script></body></html>
